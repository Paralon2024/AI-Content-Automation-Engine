name: CI

on:
  push:
    branches:
      - main
      - english-translation-api-audit
      - fix/qa-critical-repairs
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend syntax and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - name: Validate Poetry configuration
        run: poetry check --lock

      - name: Install backend dependencies
        run: poetry install --no-root --only main

      - name: Compile Python sources
        run: poetry run python -m compileall -q api flows tools
      - name: Run backend unit tests
        run: poetry run python -m unittest discover -s tests -v

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check and build
        run: npm run build

  docker-compose:
    name: Docker Compose build and network smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet

      - name: Validate the POSIX entrypoint
        run: sh -n docker-entrypoint.sh

      - name: Build both application images
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Smoke-test the backend entrypoint
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm --no-deps --entrypoint /bin/sh backend -c 'mkdir -p /opt/whisper && printf test > /opt/whisper/ggml-small.bin && /usr/local/bin/docker-entrypoint.sh sh -c "echo Entrypoint smoke test passed"'

      - name: Start both services and wait for backend health
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --detach --wait --wait-timeout 180

      - name: Verify frontend-to-backend DNS and HTTP connectivity
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T frontend node -e 'const dns = require("node:dns").promises; (async () => { const result = await dns.lookup("backend"); console.log("Backend DNS:", result.address); const response = await fetch("http://backend:8000/api/health"); if (!response.ok) throw new Error("Backend health endpoint returned HTTP " + response.status); const body = await response.json(); if (body.status !== "ok") throw new Error("Unexpected backend health response: " + JSON.stringify(body)); console.log("Backend health:", body.status); })().catch(error => { console.error(error); process.exit(1); });'

      - name: Stop Compose services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes --remove-orphans
