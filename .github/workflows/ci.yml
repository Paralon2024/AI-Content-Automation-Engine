name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - english-translation-api-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend syntax and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - name: Validate Poetry configuration
        run: poetry check --lock

      - name: Install backend dependencies
        run: poetry install --no-root --only main

      - name: Compile Python sources
        run: poetry run python -m compileall -q api flows tools

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply frontend security updates
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/english-translation-api-audit' && !contains(github.event.head_commit.message, '[deps updated]') }}
        run: npm audit fix --force

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Type-check and build
        run: npm run build

      - name: Commit security updates
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/english-translation-api-audit' && !contains(github.event.head_commit.message, '[deps updated]') }}
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore(frontend): patch npm advisories [deps updated]"
          git push origin HEAD:english-translation-api-audit
