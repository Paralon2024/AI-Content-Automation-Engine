name: CI

on:
  push:
    branches:
      - main
      - english-translation-api-audit
      - fix/qa-critical-repairs
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend syntax and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - name: Validate Poetry configuration
        run: poetry check --lock

      - name: Install backend dependencies
        run: poetry install --no-root --only main

      - name: Compile Python sources
        run: poetry run python -m compileall -q api flows tools

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check and build
        run: npm run build

  docker-build:
    name: Backend Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: ai-content-automation-engine/backend:ci
