name: Update vulnerable frontend dependencies

on:
  push:
    branches:
      - english-translation-api-audit

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[deps updated]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: english-translation-api-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Update vulnerable dependencies
        run: npm audit fix --force

      - name: Verify frontend build
        run: npm run build

      - name: Verify no high or critical vulnerabilities remain
        run: npm audit --audit-level=high

      - name: Commit updated dependency manifests
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore(frontend): patch npm advisories [deps updated]"
          git push origin HEAD:english-translation-api-audit
